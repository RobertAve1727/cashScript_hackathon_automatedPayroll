<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>eSahod | Automated Payroll on Bitcoin Cash</title>
    <meta content="eSahod — automated Philippine private-sector payroll on Bitcoin Cash CashTokens." name="description" />
    <meta content="noindex, nofollow" name="robots" />

    <link href="/build/img/eSahod_logo_small.svg" rel="icon" type="image/svg+xml" />

    <!--
      Restores the persisted theme before first paint, exactly as the template
      did. Loading it here rather than as a module avoids a flash of the
      default light theme, and it owns the theme customiser panel it appends
      to <body> once.
    -->
    <script src="/build/js/theme-script.js"></script>

    <!--
      The template's own stylesheets, in the template's cascade order —
      style.css must stay last so its overrides win. This is a deliberate
      subset: sheets for plugins these three screens never mount (Quill,
      Swiper, GLightbox, flatpickr, tom-select, gridjs, and the RTL bootstrap
      build) are not shipped. bootstrap.rtl.min.css alone would flip the
      entire layout.
    -->
    <link href="/build/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/build/plugins/icons/feather/feather.css" rel="stylesheet" />
    <link href="/build/plugins/tabler-icons/tabler-icons.min.css" rel="stylesheet" />
    <link href="/build/plugins/fontawesome/css/fontawesome.min.css" rel="stylesheet" />
    <link href="/build/plugins/fontawesome/css/all.min.css" rel="stylesheet" />
    <link href="/build/css/style.css" rel="stylesheet" />

    <!--
      Hide the template's theme customiser ON THE STANDALONE SCREENS ONLY.

      theme-script.js injects a floating gear (`.toggle-theme`) and an
      off-canvas panel (`.sidebar-themesettings`) straight into <body>, so
      they float over the sign-in page too — a layout customiser on a screen
      that has none of the layout it customises.

      `BareLayout` adds the class while such a screen is mounted and removes it
      on unmount, so the customiser stays available everywhere inside the app.
      Scoped rather than global: the earlier version of this rule hid it
      everywhere, which was more than was asked for.

      In CSS rather than by dropping the script, because theme-script.js also
      restores the persisted theme before first paint — the reason it loads in
      <head> at all. Inline so there is no frame in which the gear flashes.
    -->
    <style>
      .esahod-bare-shell .toggle-theme,
      .esahod-bare-shell .sidebar-themesettings {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
